# Filebeat Configuration - Data Analytics Team
# Description: Collecte les logs applicatifs et les envoie vers Kafka comme buffer
# Auteur: Zidane Djamal

# ============================== Filebeat inputs ==============================
filebeat.inputs:

# Logs applicatifs de la plateforme WWW
- type: log
  enabled: true
  paths:
    - /var/log/nginx/access.log
    - /var/log/nginx/error.log
  fields:
    source: "www-platform"
    log_type: "nginx"
  fields_under_root: true

# Logs applicatifs Python
- type: log
  enabled: true
  paths:
    - /var/log/app/*.log
  fields:
    source: "python-app"
    log_type: "application"
  fields_under_root: true
  multiline.pattern: '^Traceback'
  multiline.negate: false
  multiline.match: after

# ============================== Kafka output ==============================
output.kafka:
  # Liste des brokers Kafka
  hosts: ["broker1.example.com:9093", "broker2.example.com:9093", "broker3.example.com:9093"]
  
  # Topic de destination (dynamique basé sur le champ log_type)
  topic: 'app-logs-%{[log_type]}'
  
  # Stratégie de partitionnement
  partition.round_robin:
    reachable_only: false
  
  # Durabilité
  required_acks: 1
  
  # Compression pour réduire la bande passante
  compression: gzip
  max_message_bytes: 1000000

  # Configuration TLS (décommenter si SSL est activé)
  # ssl.certificate_authorities: ["/etc/filebeat/certs/kafka-ca.crt"]
  # ssl.certificate: "/etc/filebeat/certs/filebeat.crt"
  # ssl.key: "/etc/filebeat/certs/filebeat.key"

# ============================== Processors ==============================
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_cloud_metadata: ~
  - add_docker_metadata: ~

# ============================== Logging ==============================
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644
