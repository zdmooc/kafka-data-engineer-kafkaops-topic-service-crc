# Configuration Logstash : Ingestion de données depuis Kafka vers OpenSearch/Elasticsearch
# Équipe : Data Analytics
# Description : Ce pipeline consomme les événements d'analyse web (WWW) depuis Kafka,
# applique un traitement basique, et indexe les données dans OpenSearch.

input {
  kafka {
    # Liste des brokers Kafka (à adapter selon l'environnement)
    bootstrap_servers => "broker1.example.com:9092,broker2.example.com:9092,broker3.example.com:9092"
    
    # Topics à consommer
    topics => ["www-analytics-events", "app-logs"]
    
    # Identifiant du groupe de consommateurs (pour la répartition de charge)
    group_id => "logstash-analytics-indexer"
    
    # Stratégie de lecture initiale (earliest ou latest)
    auto_offset_reset => "earliest"
    
    # Désérialisation JSON automatique (les producteurs envoient du JSON)
    codec => "json"
    
    # Configuration de sécurité (décommenter si TLS/SSL est activé)
    # security_protocol => "SSL"
    # ssl_truststore_location => "/etc/logstash/certs/kafka.truststore.jks"
    # ssl_truststore_password => "${KAFKA_TRUSTSTORE_PASSWORD}"
    
    # Optimisations de consommation
    consumer_threads => 3
    max_poll_records => "500"
  }
}

filter {
  # Ajout d'un timestamp de traitement
  mutate {
    add_field => { "processed_at" => "%{@timestamp}" }
  }

  # Exemple de parsing spécifique pour les logs applicatifs
  if [topic] == "app-logs" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:log_timestamp} \[%{LOGLEVEL:log_level}\] %{GREEDYDATA:log_message}" }
    }
    date {
      match => [ "log_timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }

  # Nettoyage des champs inutiles
  mutate {
    remove_field => ["@version", "log_timestamp"]
  }
}

output {
  # Routage dynamique vers différents index selon le topic source
  if [@metadata][kafka][topic] == "www-analytics-events" {
    opensearch {
      # URL des nœuds OpenSearch (ou Elasticsearch)
      hosts => ["https://opensearch-node1:9200", "https://opensearch-node2:9200"]
      
      # Nom de l'index (rotation quotidienne)
      index => "www-analytics-%{+YYYY.MM.dd}"
      
      # Authentification (utiliser le keystore Logstash pour les mots de passe)
      user => "admin"
      password => "${OPENSEARCH_PASSWORD}"
      
      # Sécurité TLS
      ssl => true
      ssl_certificate_verification => true
      cacert => "/etc/logstash/certs/opensearch-ca.pem"
      
      # Gestion des erreurs
      ilm_enabled => false # Désactivé si OpenSearch, activé si Elasticsearch avec ILM
    }
  } else if [@metadata][kafka][topic] == "app-logs" {
    opensearch {
      hosts => ["https://opensearch-node1:9200", "https://opensearch-node2:9200"]
      index => "app-logs-%{+YYYY.MM.dd}"
      user => "admin"
      password => "${OPENSEARCH_PASSWORD}"
      ssl => true
      cacert => "/etc/logstash/certs/opensearch-ca.pem"
    }
  }

  # Sortie console pour le débogage (à désactiver en production)
  # stdout { codec => rubydebug }
}
