[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topic-as-a-service"
version = "0.1.0"
description = "Topic as a Service (FastAPI) + KafkaOps CLI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "confluent-kafka>=2.4",
  "PyYAML>=6.0",
  "prometheus-client>=0.20",
  "structlog>=24.1",
  "tenacity>=8.2",
  "opensearch-py>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
]

[project.scripts]
kafkaops = "kafkaops_cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
