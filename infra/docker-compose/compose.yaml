services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092

  topic-service:
    build:
      context: ../../services/topic-as-a-service
      dockerfile: Dockerfile
    container_name: topic-service
    depends_on:
      - kafka
    ports:
      - "8088:8088"
    environment:
      - APP_PORT=8088
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GOVERNANCE_TOPIC_NAME_REGEX=^[a-z0-9]+(\.[a-z0-9]+)*\.v[0-9]+$
      - GOVERNANCE_REQUIRE_LABELS=owner,env
      - AUTH_MODE=disabled
      # OpenSearch/Elastic sinks are optional (see docs/60-observability.md)
    volumes:
      - ../../catalog:/catalog:ro

volumes:
  kafka_data:
