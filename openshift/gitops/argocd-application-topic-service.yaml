apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: topic-as-a-service
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://example.com/your/repo.git
    targetRevision: main
    path: openshift/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
