apiVersion: v1
kind: ConfigMap
metadata:
  name: topic-service-config
data:
  APP_PORT: "8088"
  # Strimzi bootstrap service:
  KAFKA_BOOTSTRAP_SERVERS: "{{CLUSTER_NAME}}-kafka-bootstrap:9092"
  GOVERNANCE_TOPIC_NAME_REGEX: "^[a-z0-9]+(\\.[a-z0-9]+)*\\.v[0-9]+$"
  GOVERNANCE_REQUIRE_LABELS: "owner,env"
  AUTH_MODE: "api_key"
