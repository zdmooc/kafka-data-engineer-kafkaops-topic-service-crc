apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: "{{APP_NAME}}"
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: "{{APP_NAME}}"
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: "{{APP_NAME}}:{{IMAGE_TAG}}"
  triggers: []
