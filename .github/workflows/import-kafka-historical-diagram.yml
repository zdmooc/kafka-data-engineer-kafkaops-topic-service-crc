name: Import historical Kafka diagram (SHA-verified)
on:
  push:
    paths:
      - .github/workflows/import-kafka-historical-diagram.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-original-png:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout archived public Kafka Expert at its audited commit
        uses: actions/checkout@v4
        with:
          repository: zdmooc/kafka-expert
          ref: 2e41ea86a53e2bc544b4f1b7644717307dd07da1
          path: .kafka-expert-source
          persist-credentials: false
      - name: Copy only the original PNG after Git hash verification
        shell: bash
        run: |
          set -euo pipefail
          original=.kafka-expert-source/architecture/hld_diagram.png
          target=legacy/kafka-expert/architecture/hld_diagram.png
          expected=3b10458dd20368598016355ac17a1179a78d5d76
          test -f "$original"
          test "$(git hash-object "$original")" = "$expected"
          test "$(wc -c < "$original")" -eq 293873
          mkdir -p "$(dirname "$target")"
          cp "$original" "$target"
          test "$(git hash-object "$target")" = "$expected"
      - name: Update provenance manifest, without changing source hashes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("legacy/kafka-expert-source-map.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          exact = [x for x in data["files"] if x["source"] == "architecture/hld_diagram.png"]
          assert len(exact) == 1
          assert exact[0]["sha"] == "3b10458dd20368598016355ac17a1179a78d5d76"
          assert data["original_total"] == 30
          exact[0]["preserved"] = True
          data["exact_copied"] = 30
          data["still_missing"] = []
          data["deletion_status"] = "ALL_30_BLOBS_PRESERVED_PENDING_MAIN_VERIFICATION"
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
      - name: Commit exactly PNG and manifest on an isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git switch -c consolidation/kafka-expert-original-png-2026-10-20
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- legacy/kafka-expert/architecture/hld_diagram.png legacy/kafka-expert-source-map.json
          git diff --cached --check
          git commit -m "archive: preserve original Kafka Expert PNG with verified blob hash"
          git push origin HEAD:refs/heads/consolidation/kafka-expert-original-png-2026-10-20
