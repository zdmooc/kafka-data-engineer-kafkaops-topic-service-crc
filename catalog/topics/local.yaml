# Declarative topic catalog (local demo)
topics:
  - name: "demo.orders.v1"
    partitions: 3
    replication_factor: 1
    configs:
      cleanup.policy: "delete"
      retention.ms: "86400000"
    labels:
      owner: "data-analytics"
      env: "local"
    description: "Orders events"

  - name: "demo.orders.dlq.v1"
    partitions: 1
    replication_factor: 1
    configs:
      cleanup.policy: "delete"
      retention.ms: "604800000"
    labels:
      owner: "data-analytics"
      env: "local"
    description: "Dead-letter queue for orders"
