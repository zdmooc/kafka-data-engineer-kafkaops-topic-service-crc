input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["demo.orders.v1"]
    group_id => "logstash-elastic"
    codec => "json"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "kafka-demo-orders-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
